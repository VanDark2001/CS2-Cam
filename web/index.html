<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{const m=localStorage.getItem("cs2-cam-appearance");const h=new Date().getHours();const t=m==="light"||(m==="auto"&&h>=7&&h<19)?"light":"dark";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t}catch{document.documentElement.dataset.theme="dark"}</script>
  <title>CS2 Cam</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
