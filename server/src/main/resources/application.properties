# Spring Boot 服务、数据库、上传限制、跨域和监控端点配置。
server.port=${SERVER_PORT:8091}
spring.application.name=csdemo-stat-service
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER:127.0.0.1:8848}
spring.cloud.nacos.discovery.enabled=${NACOS_ENABLED:false}
spring.cloud.nacos.discovery.register-enabled=${NACOS_ENABLED:false}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
spring.datasource.url=jdbc:sqlite:${CS2_DATABASE:../data/csdemo.sqlite3}
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=none
spring.servlet.multipart.max-file-size=8GB
spring.servlet.multipart.max-request-size=8193MB
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,null}
spring.web.cors.allowed-methods=GET,POST,OPTIONS

spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.maximum-pool-size=1
